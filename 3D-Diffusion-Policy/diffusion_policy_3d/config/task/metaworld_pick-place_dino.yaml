# MetaWorld pick-place task config for DINOv2-based DP3
# Uses RGB images instead of point clouds

name: pick-place

task_name: ${name}

# Shape metadata - using images instead of point clouds
shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 512, 512]  # RGB image (C, H, W)
      type: rgb
    agent_pos:
      shape: [9]
      type: low_dim
  action:
    shape: [4]

env_runner:
  _target_: diffusion_policy_3d.env_runner.metaworld_runner_dino.MetaworldRunnerDino
  eval_episodes: 20
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  n_envs: null
  n_train: null
  n_test: null
  task_name: ${task_name}
  device: ${training.device}
  use_point_crop: false
  image_size: 512  # Should match the image size used in training

# Use the new DINOv2-compatible dataset
dataset:
  _target_: diffusion_policy_3d.dataset.metaworld_dataset_dino.MetaworldDatasetDino
  zarr_path: data/metaworld_pick-place_expert.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: 90
  image_size: 512  # Should match the image size in zarr
